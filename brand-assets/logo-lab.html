<!doctype html><meta charset="utf-8"><title>Melange Mercantile — light lab</title>
<style>
:root{--void:#070A0C;--basalt:#121A1F;--slate:#1E2B33;--ice:#E9EEF0;--silver:#98999B;--chrome:#CFCFD1}
*{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--silver);
     font:16px/1.5 system-ui,-apple-system,sans-serif;min-height:100vh}
header{padding:32px 32px 8px}
h1{font:400 20px/1.3 system-ui;letter-spacing:.14em;text-transform:uppercase;color:var(--chrome);margin:0 0 6px}
p{margin:0;max-width:60ch;font-size:15px}
.stage{display:flex;align-items:center;justify-content:center;padding:40px 32px 24px;min-height:44vh;
       cursor:crosshair;background:radial-gradient(60% 60% at 50% 40%,#101A20 0%,var(--void) 100%)}
.stage.ice{background:var(--ice)}
svg.mk{height:min(46vh,380px);width:auto;display:block}
.panel{display:flex;flex-wrap:wrap;gap:26px;padding:20px 32px 40px;border-top:1px solid var(--slate);
       background:var(--basalt)}
label{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.09em;text-transform:uppercase}
input[type=range]{width:190px;accent-color:#C2410C}
button{font:inherit;font-size:14px;padding:12px 18px;min-height:44px;background:var(--slate);
       color:var(--chrome);border:1px solid #2c3d47;border-radius:6px;cursor:pointer}
button:hover{border-color:#C2410C}
button:focus-visible{outline:3px solid #E8822B;outline-offset:2px}
output{color:var(--chrome);font-variant-numeric:tabular-nums}
.hint{padding:0 32px 34px;font-size:13px;color:#6b7478}
@media (prefers-reduced-motion:reduce){.stage{cursor:default}}
</style>
<header>
  <h1>Light lab</h1>
  <p>Move your cursor over the stage — the specular highlight tracks it. This is a real point
     light over a height map, computed by the browser. No WebGL, no 3D file.</p>
</header>
<div class="stage" id="stage">

      <stop offset="0%"   stop-color="#AEAFB1"/>
      <stop offset="35%"  stop-color="#6E7276"/>
      <stop offset="60%"  stop-color="#98999B"/>
      <stop offset="100%" stop-color="#5B5B5C"/>
    </linearGradient>
    <!-- blurred alpha as a height map, then a real point light over it -->
    <filter id="mmLit" x="-15%" y="-15%" width="130%" height="130%">

      <feSpecularLighting in="bump" surfaceScale="9" specularConstant="1.35"

        <fePointLight id="mmLight" x="200" y="150" z="900"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
      <feComposite in="SourceGraphic" in2="specIn" operator="arithmetic"

</div>
<div class="panel">
  <label>Bevel depth <input type="range" id="scale" min="2" max="24" value="9">
    <output id="oScale">9</output></label>
  <label>Softness <input type="range" id="blur" min="4" max="34" value="14">
    <output id="oBlur">14</output></label>
  <label>Polish <input type="range" id="exp" min="4" max="70" value="26">
    <output id="oExp">26</output></label>
  <label>Intensity <input type="range" id="k" min="40" max="260" value="135">
    <output id="oK">1.35</output></label>
  <label>&nbsp;<button id="bg" type="button">Toggle ground</button></label>
  <label>&nbsp;<button id="copy" type="button">Copy SVG</button></label>
</div>
<p class="hint">Reduced-motion is respected: the light parks at the upper-left and stops tracking.</p>
<script>
const VB="24 24 1432 2180";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let L={x:200,y:150};
const stage=document.getElementById("stage");

const $=id=>document.getElementById(id);
const ctl={scale:$("scale"),blur:$("blur"),exp:$("exp"),k:$("k")};

function sync(){
  const s=stage.querySelector("svg"); if(!s) return;
  const b=s.querySelector("feGaussianBlur"), sp=s.querySelector("feSpecularLighting"),
        pt=s.querySelector("fePointLight");
  b.setAttribute("stdDeviation",ctl.blur.value);
  sp.setAttribute("surfaceScale",ctl.scale.value);
  sp.setAttribute("specularExponent",ctl.exp.value);
  sp.setAttribute("specularConstant",(ctl.k.value/100).toFixed(2));
  pt.setAttribute("x",L.x); pt.setAttribute("y",L.y);
  $("oScale").value=ctl.scale.value; $("oBlur").value=ctl.blur.value;
  $("oExp").value=ctl.exp.value; $("oK").value=(ctl.k.value/100).toFixed(2);
}
Object.values(ctl).forEach(c=>c.addEventListener("input",sync));

if(!reduce){
  stage.addEventListener("pointermove",e=>{
    const s=stage.querySelector("svg"); if(!s) return;
    const r=s.getBoundingClientRect();
    L.x=24+((e.clientX-r.left)/r.width)*1432;
    L.y=24+((e.clientY-r.top)/r.height)*2180;
    sync();
  });
}
$("bg").addEventListener("click",()=>stage.classList.toggle("ice"));
$("copy").addEventListener("click",async e=>{
  const s=stage.querySelector("svg");
  await navigator.clipboard.writeText(s.outerHTML.replace(' class="mk"',''));
  e.target.textContent="Copied"; setTimeout(()=>e.target.textContent="Copy SVG",1400);
});

sync();
</script>
